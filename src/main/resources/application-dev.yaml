spring:
  application:
    name: Shortin-API
  docker:
    compose:
      profiles:
        active: infra
  jpa:
    hibernate:
      ddl-auto: validate
      database: postgres
      show-sql: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info, logfile, metrics
  endpoint:
    prometheus:
      metrics:
        export:
          enabled: true
  metrics:
    tags:
      application: shortin-api-prometheus-grafana

api:
  base-url: "http://localhost:8080"

logging:
  level:
    web: INFO

encoder:
  length: ${ENCODER_LENGTH}
  alphabet: ${ENCODER_ALPHABET}
  algorithm: ${ENCODER_ALGORITHM}
  base: ${ENCODER_BASE}